# Marketing site + studio booking pages + all webhooks.
# Install at /etc/nginx/sites-available/artweel-public.conf and symlink into
# sites-enabled. Replace the hostname if yours differs.
#
# Everything here is served by the Node API itself — the marketing pages and
# booking pages are TypeScript modules that emit HTML, so there is no static
# root to point at.
#
# certbot --nginx rewrites this block in place: it adds `listen 443 ssl`, the
# certificate paths, and a 301 from port 80. Do not hand-write those.

server {
    listen 80;
    listen [::]:80;
    server_name artweel.fillforge.cloud;

    # Stripe's raw body limit is 1mb; leave headroom so a large webhook is
    # rejected by the app's own validation rather than by nginx with a 413.
    client_max_body_size 2m;

    access_log /var/log/nginx/artweel-public.access.log;
    error_log  /var/log/nginx/artweel-public.error.log;

    # --- Staging: keep this host out of search results --------------------
    #
    # The app generates robots.txt from PUBLIC_URL and always emits
    # "Allow: /" (see src/modules/marketing/render.ts, renderRobots). That is
    # correct for the real product and wrong for a staging host carrying an
    # unsettled product name — indexing it now means re-indexing after the
    # rename. Overriding here avoids touching application code.
    #
    # DELETE this location and the X-Robots-Tag header when this becomes the
    # real production hostname.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        include snippets/artweel-proxy.conf;
        proxy_pass http://127.0.0.1:4000;
    }
}
