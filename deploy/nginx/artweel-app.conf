# Studio dashboard — the Vite SPA.
# Install at /etc/nginx/sites-available/artweel-app.conf and symlink into
# sites-enabled. Replace the hostname if yours differs.
#
# The dashboard is a static bundle that calls the API with RELATIVE paths
# (see client/src/lib/api.ts — fetch('/api/...')), which is why /api and
# /public are proxied from this host too rather than pointed at the public
# hostname. Same-origin here matches the Vite dev proxy, so there is no
# production-only CORS behaviour to discover the hard way.
#
# Auth is Bearer tokens, not cookies, so the two hostnames being different
# origins costs nothing.

server {
    listen 80;
    listen [::]:80;
    server_name app.artweel.fillforge.cloud;

    root /var/www/artweel-app;
    index index.html;

    client_max_body_size 2m;

    access_log /var/log/nginx/artweel-app.access.log;
    error_log  /var/log/nginx/artweel-app.error.log;

    # A dashboard behind a login has nothing to index. Unconditional, not just
    # a staging measure.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /api/ {
        include snippets/artweel-proxy.conf;
        proxy_pass http://127.0.0.1:4000;
    }

    # Booking pages, reachable from dashboard links.
    location /public/ {
        include snippets/artweel-proxy.conf;
        proxy_pass http://127.0.0.1:4000;
    }

    # Vite emits content-hashed filenames, so these can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must NOT be cached, or a browser keeps loading the old bundle
    # and referencing asset hashes that no longer exist after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # BrowserRouter with no basename: every unknown path is a client route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
