# Shared proxy headers. Install at /etc/nginx/snippets/artweel-proxy.conf
#
# X-Forwarded-For matters more than it looks: the Express app sets
# `trust proxy: 1`, so without these headers every request appears to come from
# 127.0.0.1 and rate limiting collapses into one shared bucket for the whole
# internet, while session audit records all point at the proxy.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        "";

proxy_connect_timeout 5s;
proxy_read_timeout    60s;
proxy_send_timeout    60s;
