# Phase 0 infrastructure.
#
# Postgres is NOT the stock image. We need two extensions that the whole
# concurrency model depends on:
#   - postgis    : service-area containment (ST_DWithin) for mobile bookings
#   - btree_gist : lets an EXCLUDE constraint mix equality (staff_id) with
#                  range overlap (tstzrange). Without it, the single most
#                  important constraint in the system cannot be created.
#
# Ports are shifted well off the defaults so this never fights with anything
# already running on the host. Note 5433 is NOT safe here: this machine has a
# native Windows Postgres bound to 0.0.0.0:5433, and it wins the race for IPv4
# localhost over Docker's port proxy — clients silently connect to the wrong
# server and fail authentication. 5434 is clear.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: booking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking_dev
    ports:
      - "5434:5432"
    volumes:
      - booking_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking_dev"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: booking-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - booking_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  booking_pgdata:
  booking_redisdata:
