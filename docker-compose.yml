# Phase 0 infrastructure.
#
# Postgres is NOT the stock image. We need two extensions that the whole
# concurrency model depends on:
#   - postgis    : service-area containment (ST_DWithin) for mobile bookings
#   - btree_gist : lets an EXCLUDE constraint mix equality (staff_id) with
#                  range overlap (tstzrange). Without it, the single most
#                  important constraint in the system cannot be created.
#
# Ports are shifted well off the defaults so this never fights with anything
# already running on the host, and deliberately far off them.
#
# 5433 is NOT safe: this machine has a native Windows Postgres bound to
# 0.0.0.0:5433, and it wins the race for IPv4 localhost over Docker's port
# proxy — clients silently connect to the wrong server and fail authentication.
#
# 5434 is not safe either, for a different and less obvious reason. Windows
# reserves blocks of ephemeral ports (Hyper-V/WSL, which Docker Desktop itself
# needs) and RE-ROLLS THOSE BLOCKS ON REBOOT. On 2026-08-12 the reserved set
# included 5434–5533; the next day it did not. When a reservation lands on the
# port, Docker cannot bind and the error names permissions, not reservation:
#   bind: An attempt was made to access a socket in a way forbidden by its
#   access permissions
# — with nothing showing as a listener, so it reads like a phantom. Chasing it
# by moving a few ports up just waits for the next reboot to re-roll onto you.
#
# 15432 is above the ephemeral range these reservations are drawn from, so it
# is stable across reboots. Inspect the current set with:
#   netsh int ipv4 show excludedportrange protocol=tcp

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: booking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking_dev
    ports:
      - "15432:5432"
    volumes:
      - booking_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking_dev"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: booking-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - booking_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  booking_pgdata:
  booking_redisdata:
