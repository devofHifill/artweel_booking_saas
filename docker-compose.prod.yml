# Production/staging stack for the shared Hostinger VPS.
#
# This box already runs n8n and SEBVM behind Traefik on the external
# `n8n_default` network, with ACME TLS via the `mytlschallenge` resolver.
# Traefik owns ports 80 and 443, so this stack publishes NOTHING to the host
# and is reached only through Traefik's routers.
#
# Two consequences worth stating plainly:
#   - The API is not on host port 4000. SEBVM's express-server already
#     publishes 0.0.0.0:4000, and a second bind would fail at startup.
#     Our API still listens on 4000 inside its own container; Traefik reaches
#     it over the docker network, where there is no collision.
#   - There is no certbot step. Traefik issues and renews certificates itself
#     through the same certresolver the other two projects use.
#
# Differences from docker-compose.yml (local development only):
#   - No Redis. REDIS_URL is declared optional in src/config/index.ts and read
#     nowhere else, so running it would be a service to patch for no behaviour.
#   - No docker/postgres-init mount. That script creates booking_test and
#     booking_shadow for the test suite and `migrate dev`; neither runs here,
#     and `migrate deploy` needs no shadow database.
#
# Postgres MUST stay the postgis image: migration 20260804115604_init_core_domain
# runs CREATE EXTENSION postgis and btree_gist, and btree_gist is what lets the
# staff_time_blocks EXCLUDE constraint mix equality with range overlap.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: artweel-postgres
    restart: unless-stopped
    env_file: ./server/.env.production
    volumes:
      - artweel_pgdata:/var/lib/postgresql/data
    # Internal network only — deliberately NOT on n8n_default. Nothing outside
    # this stack has any business reaching the database, and Traefik must not
    # be able to route to it by accident.
    networks:
      - artweel-internal
    healthcheck:
      # $$ escapes the substitution so the container's shell expands it, not
      # compose on the host.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./server
    image: artweel-api:latest
    container_name: artweel-api
    restart: unless-stopped
    env_file: ./server/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - artweel-internal
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.services.artweel-api.loadbalancer.server.port=4000"

      # --- Per-environment routing ----------------------------------------
      #
      # Staging (artweel.fillforge.cloud) and live (bookaihub.com) share this
      # file and differ only through variables Compose reads from a `.env` in
      # the project directory. That file is gitignored and never leaves its
      # box, so no hostname is committed and neither environment can be broken
      # by a deploy to the other.
      #
      # Required in every .env, or `:?` refuses the deploy by name:
      #   PUBLIC_HOST, PUBLIC_RULE, PUBLIC_MIDDLEWARES, APP_HOST, APP_MIDDLEWARES
      #
      # BOTH middlewares below are DEFINED on every environment; which one is
      # ATTACHED is what differs. A middleware no router references is inert,
      # so defining both costs nothing and keeps the two boxes symmetrical.
      #
      # artweel-noindex keeps staging out of search results. An X-Robots-Tag
      # header is stronger than a robots.txt Disallow: Disallow only asks a
      # crawler not to FETCH, while noindex tells it not to INDEX what it did
      # fetch -- and it must be allowed to fetch in order to see the header.
      # The app's own robots.txt says "Allow: /" for exactly that reason
      # (src/modules/marketing/render.ts, renderRobots).
      - "traefik.http.middlewares.artweel-noindex.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow"

      # artweel-www redirects www.<host> to the bare host, 301. Attached on
      # live; defined but unreferenced on staging, which has no www record.
      # Staging deliberately keeps www OUT of its router rule: a Host() for a
      # name with no DNS makes Traefik request a certificate it can never
      # validate, which burns the Let's Encrypt failure rate limit.
      - "traefik.http.middlewares.artweel-www.redirectregex.regex=^https?://www\\.${PUBLIC_HOST:?set PUBLIC_HOST in .env}/(.*)"
      - "traefik.http.middlewares.artweel-www.redirectregex.replacement=https://${PUBLIC_HOST}/$${1}"
      - "traefik.http.middlewares.artweel-www.redirectregex.permanent=true"

      # Marketing site, studio booking pages, Stripe/Twilio/Google webhooks.
      - "traefik.http.routers.artweel-public.rule=${PUBLIC_RULE:?set PUBLIC_RULE in .env}"
      - "traefik.http.routers.artweel-public.entrypoints=web,websecure"
      - "traefik.http.routers.artweel-public.tls=true"
      - "traefik.http.routers.artweel-public.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.artweel-public.service=artweel-api"
      - "traefik.http.routers.artweel-public.middlewares=${PUBLIC_MIDDLEWARES:?set PUBLIC_MIDDLEWARES in .env}"

      # The dashboard bundle calls /api with relative paths, so those requests
      # arrive on the DASHBOARD hostname and must be peeled off to the API
      # before the catch-all router below sends them to the static container.
      # Priority beats the client router the same way SEBVM's api router does.
      - "traefik.http.routers.artweel-api.rule=Host(`${APP_HOST:?set APP_HOST in .env}`) && (PathPrefix(`/api`) || PathPrefix(`/public`))"
      - "traefik.http.routers.artweel-api.entrypoints=web,websecure"
      - "traefik.http.routers.artweel-api.tls=true"
      - "traefik.http.routers.artweel-api.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.artweel-api.priority=100"
      - "traefik.http.routers.artweel-api.service=artweel-api"
      - "traefik.http.routers.artweel-api.middlewares=${APP_MIDDLEWARES:?set APP_MIDDLEWARES in .env}"

  client:
    build:
      context: ./client
      args:
        # Vite inlines this at BUILD time, so it cannot be set on the running
        # container the way the API's THEME_PACK can. Same value as the API's,
        # or the dashboard is a different shape from the booking page.
        VITE_THEME_PACK: ${THEME_PACK:-artweel}
    image: artweel-client:latest
    container_name: artweel-client
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.services.artweel-client.loadbalancer.server.port=80"
      - "traefik.http.routers.artweel-app.rule=Host(`${APP_HOST}`)"
      - "traefik.http.routers.artweel-app.entrypoints=web,websecure"
      - "traefik.http.routers.artweel-app.tls=true"
      - "traefik.http.routers.artweel-app.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.artweel-app.service=artweel-client"

networks:
  artweel-internal:
    driver: bridge
  # Created by the n8n stack; Traefik watches it. Never define it here.
  n8n_default:
    external: true

volumes:
  artweel_pgdata:
