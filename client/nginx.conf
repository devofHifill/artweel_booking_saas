# Serves the dashboard bundle INSIDE the client container.
#
# This is not the edge. Traefik terminates TLS and routes to this container on
# port 80, so there is no server_name matching, no certificates and no redirect
# to manage here.
#
# /api and /public are deliberately NOT proxied from here. Traefik routes those
# prefixes on the dashboard hostname straight to the api service with a higher
# router priority, which keeps this container purely static — the same shape
# the SEBVM stack already uses on this box.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A dashboard behind a login has nothing to index.
    #
    # This header is repeated in every location below that declares an
    # add_header of its own. That is not redundancy: nginx inherits add_header
    # from the enclosing level ONLY when the current level declares none, so a
    # single Cache-Control in a location silently drops the noindex with it.
    # `try_files` internally redirects to /index.html, which re-enters the
    # exact-match location below — so without the repeat, the one response
    # that determines indexing is the one that loses the header.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Vite emits content-hashed filenames, so these can be cached forever.
    # `expires` would emit a Cache-Control of its own alongside this one,
    # leaving two conflicting headers on every asset. One directive only.
    location /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
    }

    # index.html must NOT be cached, or a browser keeps loading the old bundle
    # and asking for asset hashes that no longer exist after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # BrowserRouter with no basename: every unknown path is a client route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
